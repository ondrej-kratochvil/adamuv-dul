# Testy při každém pushi a pull requestu; nasazení na GitHub Pages jen z main a jen při zelených testech.
name: Testy a nasazení

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04 # ubuntu-latest = Ubuntu 26 od 19. 10. 2026, Playwright 1.56 na něm Chromium nemá
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Kontrola typů
        run: npm run typecheck
      - name: Testy logiky
        run: npx vitest run
      - name: Prohlížeč pro testy
        run: npx playwright install --with-deps chromium
      - name: Testy v prohlížeči
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
      - name: Sestavení
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04 # ubuntu-latest = Ubuntu 26 od 19. 10. 2026, Playwright 1.56 na něm Chromium nemá
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
